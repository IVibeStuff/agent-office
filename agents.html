<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Wardrobe</title>
  <style>
    :root { --bg: #000; --panel: #0d0e11; --line: #1f2228; --text: #e7e8ec; --muted: #8b8f99; --accent: #5b6cf0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
    body { display: grid; grid-template-columns: 1fr 360px; overflow: hidden; }
    #stage { position: relative; min-width: 0; }
    #stage canvas { display: block; }
    .top { position: absolute; left: 16px; top: 14px; right: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .title { font-weight: 700; font-size: 15px; margin-right: 8px; }
    .back { color: var(--text); text-decoration: none; background: #111318; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-weight: 600; }
    .back:hover { border-color: #3a3f4c; }
    .seg { display: inline-flex; background: #111318; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
    .seg button { background: none; border: 0; color: var(--muted); padding: 6px 12px; border-radius: 7px; cursor: pointer; font: inherit; }
    .seg button.on { background: #1d2029; color: var(--text); }
    aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 18px 28px; }
    .agents { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
    .agents button { background: #111318; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 4px; cursor: pointer; font: 600 12px system-ui; }
    .agents button i { display: block; width: 10px; height: 10px; border-radius: 50%; margin: 0 auto 5px; }
    .agents button.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
    h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
    .row label { color: #c4c7cf; }
    .sw { display: flex; flex-wrap: wrap; gap: 6px; }
    .sw button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
    .sw button.on { border-color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { background: #111318; border: 1px solid var(--line); color: #c4c7cf; border-radius: 8px; padding: 5px 9px; cursor: pointer; font: 12px system-ui; text-transform: capitalize; }
    .chips button.on { background: #1d2029; color: #fff; border-color: #3a3f4c; }
    input[type=color] { width: 36px; height: 26px; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 0; cursor: pointer; }
    .toggle { position: relative; width: 38px; height: 22px; background: #23262e; border-radius: 11px; cursor: pointer; border: 0; }
    .toggle::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #8b8f99; transition: .15s; }
    .toggle.on { background: var(--accent); } .toggle.on::after { left: 19px; background: #fff; }
    .foot { display: flex; gap: 8px; margin-top: 22px; }
    .foot button { flex: 1; background: #111318; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px; cursor: pointer; font: inherit; }
    .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
    @media (max-width: 820px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  </style>
</head>
<body>
  <div id="stage">
    <div class="top">
      <a id="back" class="back" href="/?quality=hd" title="Back to the office">← Office</a>
      <span class="title">Agent wardrobe</span>
      <div class="seg" id="themes"></div>
      <div class="seg" id="poses"></div>
      <div class="seg" id="views"></div>
    </div>
  </div>
  <aside id="panel"></aside>
  <script type="module" src="/src/customise.js"></script>
</body>
</html>
