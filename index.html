<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1015" />
  <title>Agent Office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='10' width='24' height='18' rx='3' fill='%235b6cf0'/%3E%3Crect x='10' y='4' width='12' height='9' rx='2' fill='%2314b8a6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <main id="stage">
      <div id="canvas-host"></div>
      <div id="labels-host"></div>

      <header class="hud hud-tl">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1 id="office-title">Agent Office</h1>
          <span id="sim-badge" class="sim-badge" hidden>Simulation</span>
        </div>
        <div id="counts" class="counts"></div>
      </header>

      <div id="feed-warning" class="feed-warning" role="status" hidden></div>

      <nav class="hud hud-bottom" aria-label="Office controls">
        <div class="seg" id="tod" role="radiogroup" aria-label="Time of day">
          <button data-tod="now" role="radio">Now</button>
          <button data-tod="day" role="radio">Day</button>
          <button data-tod="evening" role="radio">Evening</button>
          <button data-tod="night" role="radio">Night</button>
        </div>
        <label class="theme-pick">
          <span class="sr">Theme</span>
          <select id="theme" aria-label="Theme"></select>
        </label>
        <div class="seg" id="quality" role="radiogroup" aria-label="Detail">
          <button data-q="standard" role="radio">Standard</button>
          <button data-q="hd" role="radio">HD</button>
        </div>
        <label class="theme-pick hd-only" title="How agents get to their station">
          <span class="sr">Movement</span>
          <select id="move" aria-label="Movement"></select>
        </label>
        <a id="wardrobe-link" class="btn ghost-btn hd-only" href="/agents.html">Wardrobe</a>
        <a id="team-link" class="btn ghost-btn" href="/team.html">Team</a>
        <button id="sim-btn" class="btn">Simulate Work</button>
      </nav>
    </main>

    <aside id="panel">
      <section class="card">
        <div class="card-head">
          <h2>Team <span id="team-count" class="muted"></span></h2>
          <span id="live-pill" class="live-pill">Connecting…</span>
        </div>
        <ul id="team-list" class="team-list"></ul>
      </section>
      <section class="card usage-card">
        <div class="card-head"><h2>Weekly usage</h2><span id="usage-src" class="muted small"></span></div>
        <div id="usage-body" class="usage-body"></div>
      </section>
      <section class="card activity-card">
        <div class="card-head"><h2>Activity</h2><span id="activity-count" class="muted small"></span></div>
        <ol id="activity" class="activity"></ol>
      </section>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
